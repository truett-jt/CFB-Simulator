<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CFB Game Simulation - Drive Analysis</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
    <style>
        /* ================================================================
           CSS
           ================================================================ */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* Primary palette */
            --navy: #0C2340;
            --navy-light: #1a3a5c;
            --gold: #B3A369;
            --gold-light: #c9bc8e;
            --gold-muted: rgba(179, 163, 105, 0.12);

            /* Field colors */
            --field-green: #1a5c28;
            --field-dark: #14441e;

            /* Outcome palette */
            --td-green: #2a9d4e;
            --fg-blue: #3b82f6;
            --punt-gray: #8896a7;
            --to-red: #dc3545;

            /* Neutrals */
            --bg-page: #f0f1f3;
            --bg-card: #ffffff;
            --bg-subtle: #f7f8f9;
            --border: #dfe2e6;
            --border-light: #ebedf0;
            --text-primary: #1c2028;
            --text-secondary: #5a6270;
            --text-muted: #8b929e;

            /* Shadows */
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 2px 8px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            --shadow-lg: 0 4px 16px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.04);

            /* Radius */
            --radius: 8px;
            --radius-lg: 12px;
        }

        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-page);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* ================================================================
           Layout
           ================================================================ */
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 32px 24px 64px;
        }

        /* ================================================================
           Header
           ================================================================ */
        header {
            text-align: center;
            margin-bottom: 32px;
            padding: 48px 40px 40px;
            background: var(--navy);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                repeating-linear-gradient(
                    90deg,
                    transparent,
                    transparent 80px,
                    rgba(255,255,255,0.015) 80px,
                    rgba(255,255,255,0.015) 81px
                );
            pointer-events: none;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--gold), var(--gold-light), var(--gold));
        }

        h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 2.4em;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
            position: relative;
        }

        .subtitle {
            color: var(--gold-light);
            font-size: 1.05em;
            font-weight: 400;
            letter-spacing: 0.3px;
            position: relative;
        }

        .subtitle-course {
            color: rgba(255,255,255,0.5);
            font-size: 0.82em;
            font-weight: 400;
            margin-top: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            position: relative;
        }


        /* ================================================================
           Control Panel
           ================================================================ */
        .control-panel {
            background: var(--bg-card);
            padding: 28px 32px 24px;
            border-radius: var(--radius-lg);
            margin-bottom: 28px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-light);
        }

        .control-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .form-field {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
            font-size: 0.82em;
            letter-spacing: 0.6px;
            text-transform: uppercase;
        }

        select, input {
            padding: 11px 14px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.93em;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            background: var(--bg-card);
            font-family: 'DM Sans', sans-serif;
            color: var(--text-primary);
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--navy);
            box-shadow: 0 0 0 3px rgba(12, 35, 64, 0.1);
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 11px 22px;
            font-size: 0.9em;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.3px;
            font-family: 'DM Sans', sans-serif;
        }

        .btn-primary {
            background: var(--navy);
            color: #ffffff;
        }

        .btn-primary:hover {
            background: var(--navy-light);
            box-shadow: 0 2px 8px rgba(12, 35, 64, 0.25);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--bg-subtle);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--border-light);
            color: var(--text-primary);
        }

        .btn-info {
            background: var(--gold-muted);
            color: var(--navy);
            border: 1px solid rgba(179, 163, 105, 0.3);
        }

        .btn-info:hover {
            background: rgba(179, 163, 105, 0.2);
            border-color: var(--gold);
            transform: translateY(-1px);
            box-shadow: 0 2px 6px rgba(179, 163, 105, 0.2);
        }

        /* ================================================================
           Speed Control
           ================================================================ */
        .speed-control {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border-light);
        }

        .speed-label {
            font-weight: 600;
            font-size: 0.78em;
            color: var(--text-secondary);
            letter-spacing: 0.6px;
            text-transform: uppercase;
            margin-right: 6px;
        }

        .speed-btn {
            padding: 5px 12px;
            font-size: 0.82em;
            font-weight: 600;
            border: 1px solid var(--border);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'JetBrains Mono', 'DM Sans', monospace;
            background: var(--bg-subtle);
            color: var(--text-secondary);
            letter-spacing: 0;
        }

        .speed-btn:hover {
            border-color: var(--navy);
            color: var(--navy);
            background: var(--bg-card);
        }

        .speed-btn.active {
            background: var(--navy);
            color: #ffffff;
            border-color: var(--navy);
        }

        /* ================================================================
           Visualization Container
           ================================================================ */
        .visualization-container {
            background: var(--bg-card);
            padding: 32px;
            border-radius: var(--radius-lg);
            margin-bottom: 28px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-light);
            min-height: 600px;
        }

        /* ================================================================
           Scoreboard
           ================================================================ */
        .scoreboard {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 48px;
            margin: 0 0 28px;
            padding: 28px 40px;
            background: linear-gradient(135deg, var(--navy) 0%, #162e4d 100%);
            border-radius: var(--radius);
            position: relative;
            overflow: hidden;
        }

        .scoreboard::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(179,163,105,0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(179,163,105,0.06) 0%, transparent 60%);
            pointer-events: none;
        }

        .team-score {
            text-align: center;
            position: relative;
        }

        .team-name {
            font-size: 0.82em;
            font-weight: 600;
            margin-bottom: 6px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--gold-light);
        }

        .team-points {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 3.5em;
            font-weight: 800;
            line-height: 1;
            color: #ffffff;
        }

        /* ================================================================
           Field Visualization
           ================================================================ */
        .field-visualization {
            margin: 24px 0;
        }

        /* ================================================================
           Drive Timeline
           ================================================================ */
        .drive-timeline {
            margin-top: 28px;
        }

        .drive-item {
            padding: 14px 18px;
            margin-bottom: 6px;
            border-radius: 6px;
            border-left: 4px solid;
            background: var(--bg-subtle);
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .drive-item:hover {
            background: var(--border-light);
            box-shadow: var(--shadow-sm);
            transform: translateX(3px);
        }

        .drive-item.touchdown {
            border-left-color: var(--td-green);
        }

        .drive-item.field-goal {
            border-left-color: var(--fg-blue);
        }

        .drive-item.punt {
            border-left-color: var(--punt-gray);
        }

        .drive-item.turnover {
            border-left-color: var(--to-red);
        }

        .drive-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .drive-team {
            font-weight: 600;
            font-size: 0.92em;
            color: var(--text-primary);
        }

        .drive-result {
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 0.75em;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        .result-touchdown {
            background: var(--td-green);
            color: white;
        }

        .result-field-goal {
            background: var(--fg-blue);
            color: white;
        }

        .result-punt {
            background: var(--punt-gray);
            color: white;
        }

        .result-turnover {
            background: var(--to-red);
            color: white;
        }

        .drive-details {
            color: var(--text-muted);
            font-size: 0.85em;
        }

        /* ================================================================
           Statistics Container
           ================================================================ */
        .stats-container {
            background: var(--bg-card);
            padding: 32px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-light);
            display: none;
        }

        .stats-container.active {
            display: block;
        }

        .stats-title {
            margin-bottom: 24px;
            color: var(--navy);
            font-weight: 700;
            font-size: 1.35em;
            letter-spacing: -0.3px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }

        .stat-card {
            background: var(--bg-subtle);
            padding: 20px;
            border-radius: var(--radius);
            border-left: 3px solid var(--navy);
            transition: box-shadow 0.2s ease, transform 0.2s ease;
        }

        .stat-card:hover {
            box-shadow: var(--shadow-sm);
            transform: translateY(-1px);
        }

        .stat-label {
            font-size: 0.78em;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .stat-value {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 2em;
            font-weight: 700;
            color: var(--navy);
        }

        /* ================================================================
           Animations
           ================================================================ */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-in {
            animation: slideIn 0.35s ease-out both;
        }

        /* ================================================================
           Responsive
           ================================================================ */
        @media (max-width: 768px) {
            .container {
                padding: 20px 16px 48px;
            }
            header {
                padding: 32px 24px 28px;
            }
            h1 {
                font-size: 1.7em;
            }
            .control-panel, .visualization-container, .stats-container {
                padding: 20px;
            }
            .scoreboard {
                gap: 24px;
                padding: 20px;
            }
            .team-points {
                font-size: 2.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>College Football Game Simulation</h1>
            <p class="subtitle">Drive-by-Drive Analysis &amp; Visualization System</p>
            <p class="subtitle-course">CSE 6242 Data &amp; Visual Analytics &mdash; Group #62</p>
        </header>

        <div class="control-panel">
            <div class="control-group">
                <div class="form-field">
                    <label for="homeTeam">Home Team</label>
                    <select id="homeTeam">
                        <option value="">Select Home Team</option>
                        <option value="Georgia Tech">Georgia Tech (ACC)</option>
                        <option value="Clemson">Clemson (ACC)</option>
                        <option value="Florida State">Florida State (ACC)</option>
                        <option value="Miami">Miami (ACC)</option>
                        <option value="North Carolina">North Carolina (ACC)</option>
                        <option value="Duke">Duke (ACC)</option>
                        <option value="Alabama">Alabama (SEC)</option>
                        <option value="Auburn">Auburn (SEC)</option>
                        <option value="Georgia">Georgia (SEC)</option>
                        <option value="Florida">Florida (SEC)</option>
                        <option value="Tennessee">Tennessee (SEC)</option>
                        <option value="LSU">LSU (SEC)</option>
                        <option value="Oklahoma">Oklahoma (SEC)</option>
                        <option value="Texas">Texas (SEC)</option>
                        <option value="Ohio State">Ohio State (Big Ten)</option>
                        <option value="Michigan">Michigan (Big Ten)</option>
                        <option value="Penn State">Penn State (Big Ten)</option>
                        <option value="USC">USC (Big Ten)</option>
                        <option value="Oregon">Oregon (Big Ten)</option>
                        <option value="Washington">Washington (Big Ten)</option>
                    </select>
                </div>
                
                <div class="form-field">
                    <label for="awayTeam">Away Team</label>
                    <select id="awayTeam">
                        <option value="">Select Away Team</option>
                        <option value="Georgia Tech">Georgia Tech (ACC)</option>
                        <option value="Clemson">Clemson (ACC)</option>
                        <option value="Florida State">Florida State (ACC)</option>
                        <option value="Miami">Miami (ACC)</option>
                        <option value="North Carolina">North Carolina (ACC)</option>
                        <option value="Duke">Duke (ACC)</option>
                        <option value="Alabama">Alabama (SEC)</option>
                        <option value="Auburn">Auburn (SEC)</option>
                        <option value="Georgia">Georgia (SEC)</option>
                        <option value="Florida">Florida (SEC)</option>
                        <option value="Tennessee">Tennessee (SEC)</option>
                        <option value="LSU">LSU (SEC)</option>
                        <option value="Oklahoma">Oklahoma (SEC)</option>
                        <option value="Texas">Texas (SEC)</option>
                        <option value="Ohio State">Ohio State (Big Ten)</option>
                        <option value="Michigan">Michigan (Big Ten)</option>
                        <option value="Penn State">Penn State (Big Ten)</option>
                        <option value="USC">USC (Big Ten)</option>
                        <option value="Oregon">Oregon (Big Ten)</option>
                        <option value="Washington">Washington (Big Ten)</option>
                    </select>
                </div>
                
            </div>
            
            <div class="button-group">
                <button class="btn-primary" onclick="runSimulation()" title="Simulation engine coming soon">Run Simulation</button>
                <button class="btn-info" onclick="loadSampleGame1()">Load Sample Game 1</button>
                <button class="btn-info" onclick="loadSampleGame2()">Load Sample Game 2</button>
                <button class="btn-secondary" onclick="resetVisualization()">Reset</button>
            </div>

            <div class="speed-control">
                <span class="speed-label">Playback Speed</span>
                <button class="speed-btn" onclick="setPlaybackSpeed(0.25)">0.25×</button>
                <button class="speed-btn" onclick="setPlaybackSpeed(0.5)">0.5×</button>
                <button class="speed-btn active" onclick="setPlaybackSpeed(1)">1×</button>
                <button class="speed-btn" onclick="setPlaybackSpeed(1.5)">1.5×</button>
                <button class="speed-btn" onclick="setPlaybackSpeed(2)">2×</button>
            </div>
        </div>

        <div class="visualization-container" id="vizContainer">
            <h2 style="text-align: center; color: var(--text-muted); margin-top: 120px; font-weight: 400; font-size: 1.1em;">
                Select a sample game to begin
            </h2>
        </div>

        <div class="stats-container" id="statsContainer">
            <h2 class="stats-title">Game Statistics</h2>
            <div class="stats-grid" id="statsGrid"></div>
        </div>
    </div>

    <script>
        // ============================================================================
        // Playback Speed Control
        // ============================================================================
        let playbackSpeed = 1;
        
        function setPlaybackSpeed(speed) {
            playbackSpeed = speed;
            document.querySelectorAll('.speed-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent.trim() === speed + '×');
            });
        }

        // ============================================================================
        // SAMPLE DATA
        // ============================================================================
        const SAMPLE_GAME_1 = {
            "homeTeam": "Georgia Tech",
            "awayTeam": "Clemson",
            "homeScore": 31,
            "awayScore": 24,
            "drives": [
                {"driveNumber":1,"team":"Clemson","startYardLine":25,"plays":6,"yardsGained":48,"outcome":"punt","timeOfPossession":"2:34"},
                {"driveNumber":2,"team":"Georgia Tech","startYardLine":32,"plays":11,"yardsGained":68,"outcome":"touchdown","timeOfPossession":"4:52"},
                {"driveNumber":3,"team":"Clemson","startYardLine":25,"plays":8,"yardsGained":72,"outcome":"touchdown","timeOfPossession":"3:18"},
                {"driveNumber":4,"team":"Georgia Tech","startYardLine":25,"plays":4,"yardsGained":12,"outcome":"punt","timeOfPossession":"1:45"},
                {"driveNumber":5,"team":"Clemson","startYardLine":38,"plays":7,"yardsGained":38,"outcome":"field-goal","timeOfPossession":"2:56"},
                {"driveNumber":6,"team":"Georgia Tech","startYardLine":25,"plays":9,"yardsGained":58,"outcome":"field-goal","timeOfPossession":"3:42"},
                {"driveNumber":7,"team":"Clemson","startYardLine":25,"plays":3,"yardsGained":8,"outcome":"turnover","timeOfPossession":"1:12"},
                {"driveNumber":8,"team":"Georgia Tech","startYardLine":42,"plays":7,"yardsGained":58,"outcome":"touchdown","timeOfPossession":"3:05"},
                {"driveNumber":9,"team":"Clemson","startYardLine":25,"plays":10,"yardsGained":75,"outcome":"touchdown","timeOfPossession":"4:28"},
                {"driveNumber":10,"team":"Georgia Tech","startYardLine":25,"plays":5,"yardsGained":32,"outcome":"punt","timeOfPossession":"2:15"},
                {"driveNumber":11,"team":"Clemson","startYardLine":28,"plays":6,"yardsGained":45,"outcome":"field-goal","timeOfPossession":"2:38"},
                {"driveNumber":12,"team":"Georgia Tech","startYardLine":25,"plays":12,"yardsGained":75,"outcome":"touchdown","timeOfPossession":"5:22"},
                {"driveNumber":13,"team":"Clemson","startYardLine":25,"plays":8,"yardsGained":52,"outcome":"field-goal","timeOfPossession":"3:15"},
                {"driveNumber":14,"team":"Georgia Tech","startYardLine":25,"plays":6,"yardsGained":38,"outcome":"field-goal","timeOfPossession":"2:48"}
            ],
            "stats": {
                "Georgia Tech": {"score":31,"totalYards":341,"turnovers":0,"timeOfPossession":"23:49","firstDowns":18},
                "Clemson": {"score":24,"totalYards":338,"turnovers":1,"timeOfPossession":"26:11","firstDowns":16}
            }
        };

        const SAMPLE_GAME_2 = {
            "homeTeam": "Alabama",
            "awayTeam": "Auburn",
            "homeScore": 42,
            "awayScore": 17,
            "drives": [
                {"driveNumber":1,"team":"Auburn","startYardLine":25,"plays":3,"yardsGained":5,"outcome":"punt","timeOfPossession":"1:18"},
                {"driveNumber":2,"team":"Alabama","startYardLine":45,"plays":8,"yardsGained":55,"outcome":"touchdown","timeOfPossession":"3:25"},
                {"driveNumber":3,"team":"Auburn","startYardLine":25,"plays":9,"yardsGained":68,"outcome":"field-goal","timeOfPossession":"3:52"},
                {"driveNumber":4,"team":"Alabama","startYardLine":25,"plays":10,"yardsGained":75,"outcome":"touchdown","timeOfPossession":"4:15"},
                {"driveNumber":5,"team":"Auburn","startYardLine":25,"plays":5,"yardsGained":15,"outcome":"turnover","timeOfPossession":"1:48"},
                {"driveNumber":6,"team":"Alabama","startYardLine":35,"plays":6,"yardsGained":65,"outcome":"touchdown","timeOfPossession":"2:35"},
                {"driveNumber":7,"team":"Auburn","startYardLine":25,"plays":11,"yardsGained":75,"outcome":"touchdown","timeOfPossession":"5:12"},
                {"driveNumber":8,"team":"Alabama","startYardLine":25,"plays":7,"yardsGained":52,"outcome":"field-goal","timeOfPossession":"2:58"},
                {"driveNumber":9,"team":"Auburn","startYardLine":25,"plays":4,"yardsGained":18,"outcome":"punt","timeOfPossession":"1:42"},
                {"driveNumber":10,"team":"Alabama","startYardLine":42,"plays":9,"yardsGained":58,"outcome":"touchdown","timeOfPossession":"3:48"},
                {"driveNumber":11,"team":"Auburn","startYardLine":25,"plays":8,"yardsGained":65,"outcome":"touchdown","timeOfPossession":"3:28"},
                {"driveNumber":12,"team":"Alabama","startYardLine":25,"plays":6,"yardsGained":48,"outcome":"field-goal","timeOfPossession":"2:22"},
                {"driveNumber":13,"team":"Auburn","startYardLine":25,"plays":3,"yardsGained":8,"outcome":"turnover","timeOfPossession":"1:05"},
                {"driveNumber":14,"team":"Alabama","startYardLine":38,"plays":5,"yardsGained":62,"outcome":"touchdown","timeOfPossession":"2:15"},
                {"driveNumber":15,"team":"Auburn","startYardLine":25,"plays":6,"yardsGained":32,"outcome":"punt","timeOfPossession":"2:18"}
            ],
            "stats": {
                "Alabama": {"score":42,"totalYards":415,"turnovers":0,"timeOfPossession":"21:38","firstDowns":22},
                "Auburn": {"score":17,"totalYards":286,"turnovers":2,"timeOfPossession":"19:43","firstDowns":14}
            }
        };
        // ============================================================================
        // Visualization Module
        // ============================================================================
        const VisualizationModule = {
            renderGameVisualization(gameData) {
                const container = d3.select('#vizContainer');
                container.html('');
                this.renderScoreboard(container, gameData);
                this.renderFieldVisualization(container, gameData);
                this.renderDriveTimeline(container, gameData);
                this.renderStatistics(gameData);
            },
            
            renderScoreboard(container, gameData) {
                const scoreboard = container.append('div')
                    .attr('class', 'scoreboard animate-in');
                
                const awayTeam = scoreboard.append('div').attr('class', 'team-score');
                awayTeam.append('div').attr('class', 'team-name').text(gameData.awayTeam);
                awayTeam.append('div').attr('class', 'team-points').text(gameData.awayScore);
                
                scoreboard.append('div')
                    .style('font-size', '1.4em')
                    .style('color', 'rgba(255,255,255,0.35)')
                    .style('font-weight', '600')
                    .style('letter-spacing', '2px')
                    .style('align-self', 'center')
                    .text('VS');
                
                const homeTeam = scoreboard.append('div').attr('class', 'team-score');
                homeTeam.append('div').attr('class', 'team-name').text(gameData.homeTeam);
                homeTeam.append('div').attr('class', 'team-points').text(gameData.homeScore);
            },
            
            renderFieldVisualization(container, gameData) {
                const fieldDiv = container.append('div')
                    .attr('class', 'field-visualization animate-in');
                
                fieldDiv.append('div')
                    .style('text-align', 'center')
                    .style('margin-bottom', '15px')
                    .style('color', 'var(--text-muted)')
                    .style('font-size', '0.88em')
                    .style('letter-spacing', '0.3px')
                    .html(`<strong style="color:var(--text-secondary)">${gameData.homeTeam}</strong> (\u2192) vs <strong style="color:var(--text-secondary)">${gameData.awayTeam}</strong> (\u2190)`);
                
                const width = 1000;
                const height = 250;
                const margin = { top: 40, right: 40, bottom: 40, left: 40 };
                
                const svg = fieldDiv.append('svg')
                    .attr('width', '100%')
                    .attr('height', height)
                    .attr('viewBox', `0 0 ${width} ${height}`);
                
                svg.append('rect')
                    .attr('x', margin.left).attr('y', margin.top)
                    .attr('width', width - margin.left - margin.right)
                    .attr('height', height - margin.top - margin.bottom)
                    .attr('fill', '#1a5c28')
                    .attr('stroke', '#fff').attr('stroke-width', 1);
                
                const fieldWidth = width - margin.left - margin.right;
                for (let yard = 0; yard <= 100; yard += 10) {
                    const x = margin.left + (yard / 100) * fieldWidth;
                    
                    svg.append('line')
                        .attr('x1', x).attr('y1', margin.top)
                        .attr('x2', x).attr('y2', height - margin.bottom)
                        .attr('stroke', '#fff')
                        .attr('stroke-width', yard % 50 === 0 ? 2 : 1)
                        .attr('opacity', 0.3);
                    
                    if (yard % 10 === 0) {
                        svg.append('text')
                            .attr('x', x).attr('y', margin.top - 8)
                            .attr('text-anchor', 'middle')
                            .attr('fill', '#fff').attr('font-size', '14px').attr('font-weight', '700')
                            .text(yard <= 50 ? yard : 100 - yard);
                    }
                    
                    if (yard % 5 === 0 && yard % 10 !== 0) {
                        svg.append('line')
                            .attr('x1', x).attr('y1', margin.top)
                            .attr('x2', x).attr('y2', height - margin.bottom)
                            .attr('stroke', '#fff').attr('stroke-width', 1)
                            .attr('stroke-dasharray', '5,5').attr('opacity', 0.2);
                    }
                }
                
                svg.append('text')
                    .attr('x', margin.left - 25).attr('y', height / 2)
                    .attr('text-anchor', 'middle').attr('fill', '#ffffff')
                    .attr('font-size', '12px').attr('font-weight', '500').attr('opacity', '0.8')
                    .attr('transform', `rotate(-90, ${margin.left - 25}, ${height / 2})`)
                    .text(gameData.awayTeam.toUpperCase());
                
                svg.append('text')
                    .attr('x', width - margin.right + 25).attr('y', height / 2)
                    .attr('text-anchor', 'middle').attr('fill', '#ffffff')
                    .attr('font-size', '12px').attr('font-weight', '500').attr('opacity', '0.8')
                    .attr('transform', `rotate(90, ${width - margin.right + 25}, ${height / 2})`)
                    .text(gameData.homeTeam.toUpperCase());
                
                const driveInfo = svg.append('text')
                    .attr('x', width / 2).attr('y', height - 10)
                    .attr('text-anchor', 'middle').attr('fill', '#5a6270')
                    .attr('font-size', '14px').attr('font-weight', '500')
                    .text('Initializing simulation...');
                
                const replayButtonGroup = svg.append('g')
                    .attr('class', 'replay-button')
                    .style('display', 'none').style('cursor', 'pointer');
                
                const buttonX = width / 2;
                const buttonY = height - 50;
                
                replayButtonGroup.append('rect')
                    .attr('x', buttonX - 60).attr('y', buttonY - 15)
                    .attr('width', 120).attr('height', 30)
                    .attr('fill', '#0C2340').attr('rx', 4).attr('stroke', 'none');
                
                replayButtonGroup.append('text')
                    .attr('x', buttonX).attr('y', buttonY + 5)
                    .attr('text-anchor', 'middle').attr('fill', '#fff')
                    .attr('font-size', '13px').attr('font-weight', '500')
                    .text('\u21BB Replay');
                
                replayButtonGroup.on('mouseover', function() {
                    d3.select(this).select('rect').transition().duration(200).attr('fill', '#1a3a5c');
                })
                .on('mouseout', function() {
                    d3.select(this).select('rect').transition().duration(200).attr('fill', '#0C2340');
                });
                
                const ball = svg.append('g').attr('class', 'football').style('display', 'none');
                ball.append('ellipse').attr('rx', 10).attr('ry', 7).attr('fill', '#8B4513').attr('stroke', '#fff').attr('stroke-width', 1);
                ball.append('line').attr('x1', -8).attr('y1', 0).attr('x2', 8).attr('y2', 0).attr('stroke', '#fff').attr('stroke-width', 1.5);
                for (let i = -3; i <= 3; i += 2) {
                    ball.append('line').attr('x1', i).attr('y1', -4).attr('x2', i).attr('y2', 4).attr('stroke', '#fff').attr('stroke-width', 1);
                }
                
                const trail = svg.append('path')
                    .attr('fill', 'none').attr('stroke', '#B3A369')
                    .attr('stroke-width', 2).attr('opacity', 0.6).attr('stroke-dasharray', '4,4');
                
                const animationState = { isPlaying: false, currentDriveIndex: 0 };
                
                replayButtonGroup.on('click', function() {
                    replayButtonGroup.style('display', 'none');
                    driveInfo.text('Replaying simulation...');
                    svg.selectAll('.final-marker').remove();
                    animationState.currentDriveIndex = 0;
                    animationState.isPlaying = true;
                    startAnimation();
                });
                
                const startAnimation = () => {
                    this.animateDrives(svg, gameData, ball, trail, driveInfo, fieldWidth, margin, height, replayButtonGroup, animationState);
                };
                
                startAnimation();
            },
            
            animateDrives(svg, gameData, ball, trail, driveInfo, fieldWidth, margin, height, replayButtonGroup, animationState) {
                const fieldCenterY = height / 2;
                
                const animateNextDrive = () => {
                    if (animationState.currentDriveIndex >= gameData.drives.length) {
                        driveInfo.text('Simulation Complete');
                        ball.style('display', 'none');
                        trail.attr('d', null);
                        animationState.isPlaying = false;
                        replayButtonGroup.style('display', 'block');
                        this.drawFinalMarkers(svg, gameData, fieldWidth, margin, fieldCenterY, ball, trail, driveInfo, replayButtonGroup, animationState);
                        return;
                    }
                    
                    const drive = gameData.drives[animationState.currentDriveIndex];
                    const isHomeTeam = drive.team === gameData.homeTeam;
                    let startYardLine, endYardLine;
                    
                    if (isHomeTeam) {
                        startYardLine = drive.startYardLine;
                        endYardLine = drive.outcome === 'touchdown' ? 100 : Math.min(100, drive.startYardLine + drive.yardsGained);
                    } else {
                        startYardLine = drive.startYardLine;
                        endYardLine = drive.outcome === 'touchdown' ? 0 : Math.max(0, drive.startYardLine - drive.yardsGained);
                    }
                    
                    const startX = margin.left + (startYardLine / 100) * fieldWidth;
                    const endX = margin.left + (endYardLine / 100) * fieldWidth;
                    const direction = isHomeTeam ? '\u2192' : '\u2190';
                    driveInfo.text(`Drive ${drive.driveNumber}: ${drive.team} ${direction} ${drive.plays} plays, ${drive.yardsGained} yards`);
                    
                    ball.style('display', 'block').attr('transform', `translate(${startX}, ${fieldCenterY})`);
                    trail.attr('d', `M ${startX},${fieldCenterY} L ${endX},${fieldCenterY}`);
                    
                    ball.transition().duration(800 / playbackSpeed).ease(d3.easeLinear)
                        .attr('transform', `translate(${endX}, ${fieldCenterY})`)
                        .on('end', () => {
                            this.showOutcomeAnimation(svg, drive, endX, fieldCenterY, () => {
                                setTimeout(() => { animationState.currentDriveIndex++; animateNextDrive(); }, 400 / playbackSpeed);
                            });
                        });
                };
                
                animationState.isPlaying = true;
                animateNextDrive();
            },
            
            animateSingleDrive(svg, gameData, drive, ball, trail, driveInfo, fieldWidth, margin, height, callback) {
                const fieldCenterY = height / 2;
                const isHomeTeam = drive.team === gameData.homeTeam;
                let startYardLine, endYardLine;
                
                if (isHomeTeam) {
                    startYardLine = drive.startYardLine;
                    endYardLine = drive.outcome === 'touchdown' ? 100 : Math.min(100, drive.startYardLine + drive.yardsGained);
                } else {
                    startYardLine = drive.startYardLine;
                    endYardLine = drive.outcome === 'touchdown' ? 0 : Math.max(0, drive.startYardLine - drive.yardsGained);
                }
                
                const startX = margin.left + (startYardLine / 100) * fieldWidth;
                const endX = margin.left + (endYardLine / 100) * fieldWidth;
                const direction = isHomeTeam ? '\u2192' : '\u2190';
                driveInfo.text(`Replaying Drive ${drive.driveNumber}: ${drive.team} ${direction} ${drive.plays} plays, ${drive.yardsGained} yards`);
                
                ball.style('display', 'block').attr('transform', `translate(${startX}, ${fieldCenterY})`);
                trail.attr('d', `M ${startX},${fieldCenterY} L ${endX},${fieldCenterY}`);
                
                ball.transition().duration(800 / playbackSpeed).ease(d3.easeLinear)
                    .attr('transform', `translate(${endX}, ${fieldCenterY})`)
                    .on('end', () => {
                        this.showOutcomeAnimation(svg, drive, endX, fieldCenterY, () => {
                            setTimeout(() => {
                                ball.style('display', 'none');
                                trail.attr('d', null);
                                driveInfo.text('Simulation Complete');
                                if (callback) callback();
                            }, 500 / playbackSpeed);
                        });
                    });
            },
            
            showOutcomeAnimation(svg, drive, x, y, callback) {
                const outcomeGroup = svg.append('g').attr('transform', `translate(${x}, ${y})`);
                let color, text;
                switch(drive.outcome) {
                    case 'touchdown': color = '#2a9d4e'; text = 'TD'; break;
                    case 'field-goal': color = '#3b82f6'; text = 'FG'; break;
                    case 'punt': color = '#8896a7'; text = 'PUNT'; break;
                    case 'turnover': color = '#dc3545'; text = 'TO'; break;
                }
                
                outcomeGroup.append('circle').attr('r', 0).attr('fill', color).attr('opacity', 0.6)
                    .transition().duration(250 / playbackSpeed).attr('r', 20).attr('opacity', 0).remove();
                
                const outcomeText = outcomeGroup.append('text')
                    .attr('text-anchor', 'middle').attr('y', -30)
                    .attr('fill', color).attr('font-size', '16px').attr('font-weight', '600').attr('opacity', 0)
                    .text(text);
                
                outcomeText.transition().duration(150 / playbackSpeed).attr('opacity', 1)
                    .transition().delay(200 / playbackSpeed).duration(150 / playbackSpeed).attr('opacity', 0)
                    .on('end', () => { outcomeGroup.remove(); callback(); });
            },
            
            drawFinalMarkers(svg, gameData, fieldWidth, margin, fieldCenterY, ball, trail, driveInfo, replayButtonGroup, animationState) {
                const markers = svg.selectAll('.final-marker')
                    .data(gameData.drives).enter().append('circle')
                    .attr('class', 'final-marker')
                    .attr('cx', d => margin.left + (d.startYardLine / 100) * fieldWidth)
                    .attr('cy', fieldCenterY).attr('r', 5)
                    .attr('fill', d => {
                        switch(d.outcome) {
                            case 'touchdown': return '#2a9d4e';
                            case 'field-goal': return '#3b82f6';
                            case 'punt': return '#8896a7';
                            case 'turnover': return '#dc3545';
                            default: return '#fff';
                        }
                    })
                    .attr('stroke', '#fff').attr('stroke-width', 2).attr('opacity', 0).style('cursor', 'pointer');
                
                markers.transition().duration(300).delay((d, i) => i * 30).attr('opacity', 1);
                
                markers.on('mouseover', function(event, d) {
                    d3.select(this).transition().duration(200).attr('r', 8);
                    const direction = d.team === gameData.homeTeam ? '\u2192' : '\u2190';
                    driveInfo.text(`Drive ${d.driveNumber}: ${d.team} ${direction} ${d.plays} plays, ${d.yardsGained} yards (click to replay)`);
                })
                .on('mouseout', function(event, d) {
                    d3.select(this).transition().duration(200).attr('r', 5);
                    driveInfo.text('Simulation Complete');
                })
                .on('click', (event, d) => {
                    if (animationState.isPlaying) return;
                    replayButtonGroup.style('display', 'none');
                    this.animateSingleDrive(svg, gameData, d, ball, trail, driveInfo, fieldWidth, margin, 250, () => {
                        replayButtonGroup.style('display', 'block');
                    });
                });
            },
            
            renderDriveTimeline(container, gameData) {
                const timeline = container.append('div').attr('class', 'drive-timeline');
                
                timeline.append('h3')
                    .style('margin-bottom', '20px')
                    .style('color', 'var(--navy)')
                    .style('font-weight', '700')
                    .style('font-size', '1.2em')
                    .style('letter-spacing', '-0.3px')
                    .text('Drive Sequence');
                
                const drives = timeline.selectAll('.drive-item')
                    .data(gameData.drives).enter().append('div')
                    .attr('class', d => `drive-item ${d.outcome} animate-in`)
                    .style('animation-delay', (d, i) => `${i * 0.05}s`);
                
                const driveHeader = drives.append('div').attr('class', 'drive-header');
                driveHeader.append('span').attr('class', 'drive-team').text(d => `Drive ${d.driveNumber}: ${d.team}`);
                driveHeader.append('span').attr('class', d => `drive-result result-${d.outcome}`).text(d => d.outcome.toUpperCase());
                
                drives.append('div').attr('class', 'drive-details')
                    .html(d => `${d.plays} plays, ${d.yardsGained} yards | Started at ${d.startYardLine} yard line | TOP: ${d.timeOfPossession}`);
            },
            
            renderStatistics(gameData) {
                const statsContainer = d3.select('#statsContainer');
                statsContainer.classed('active', true);
                const statsGrid = d3.select('#statsGrid');
                statsGrid.html('');
                
                [gameData.homeTeam, gameData.awayTeam].forEach(team => {
                    const teamStats = gameData.stats[team];
                    this.createStatCard(statsGrid, `${team} Score`, teamStats.score);
                    this.createStatCard(statsGrid, `${team} Total Yards`, teamStats.totalYards);
                    this.createStatCard(statsGrid, `${team} Turnovers`, teamStats.turnovers);
                    this.createStatCard(statsGrid, `${team} First Downs`, teamStats.firstDowns);
                    this.createStatCard(statsGrid, `${team} Time of Possession`, teamStats.timeOfPossession);
                });
            },
            
            createStatCard(container, label, value) {
                const card = container.append('div').attr('class', 'stat-card animate-in');
                card.append('div').attr('class', 'stat-label').text(label);
                card.append('div').attr('class', 'stat-value').text(value);
            }
        };

        // ============================================================================
        // Application Controller
        // ============================================================================
        
        function loadSampleGame1() {
            VisualizationModule.renderGameVisualization(SAMPLE_GAME_1);
        }
        
        function loadSampleGame2() {
            VisualizationModule.renderGameVisualization(SAMPLE_GAME_2);
        }
        
        
        /**
         * Placeholder for simulation engine integration
         * Currently a no-op; will connect to the backend simulation model
         */
        function runSimulation() {
            // Simulation engine not yet connected
        }
        
        function resetVisualization() {
            d3.select('#vizContainer').html(`
                <h2 style="text-align: center; color: var(--text-muted); margin-top: 120px; font-weight: 400; font-size: 1.1em;">
                    Select a sample game to begin
                </h2>
            `);
            d3.select('#statsContainer').classed('active', false);
            document.getElementById('homeTeam').value = '';
            document.getElementById('awayTeam').value = '';
        }
    </script>
